<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title }} · archivecodec</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/static/theme.css"><link rel="stylesheet" href="/static/layout.css"><link rel="stylesheet" href="/static/components.css"></head>
<body><div class="app"><aside class="rail"><a class="rail__brand" href="/intake">ARCHIVECODEC</a><nav class="rail__nav"><a class="rail__item" href="/intake">文件采信</a>
<a class="rail__item" href="/encoding">编码判定</a>
<a class="rail__item" href="/fields">字段保形</a>
<a class="rail__item" href="/content">内容归一</a>
<a class="rail__item" href="/reconcile">索引对账</a>
<a class="rail__item" href="/runs">批次导出</a>
<a class="rail__item" href="/batch">馆际共享</a></nav><div class="rail__foot">规则 2026.11<br>L7 终端手册</div></aside>
<div class="work"><header class="topbar"><span class="topbar__title">{{ title }}</span><span class="signal">共享策略 :: 现行授权</span><button class="btn" id="refresh">刷新</button></header>
<main class="content">
<section class="panel" style="max-width:420px;margin:48px auto">
  <div class="panel__head"><h2>登录</h2><span class="panel__meta">可信身份</span></div>
  <div class="panel__body">
    <form id="login-form" style="display:grid;gap:10px">
      <label>用户名<input class="num" name="username" autocomplete="username" style="width:100%"></label>
      <label>口令<input class="num" name="password" type="password" autocomplete="current-password" style="width:100%"></label>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn--primary" type="submit">登录</button>
      <pre class="result" id="login-result">等待登录</pre>
    </form>
  </div>
</section>
<script>
document.querySelector("#login-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const form = new FormData(event.target);
  const out = document.querySelector("#login-result");
  out.textContent = "登录中";
  try {
    const res = await fetch("/api/auth/login", {
      method: "POST", headers: {"content-type": "application/json"},
      credentials: "same-origin",
      body: JSON.stringify({username: form.get("username"), password: form.get("password")}),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) { out.textContent = body.message || "登录失败"; return; }
    const next = form.get("next") || "/batch";
    location.href = next.startsWith("/") ? next : "/batch";
  } catch (e) { out.textContent = "请求失败，请重试"; }
});
</script>
</main><footer class="statusbar"><span>v2026.11</span><span>Asia/Shanghai</span><span>/api/health</span></footer></div></div>
</body></html>
